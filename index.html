<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregas</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#5046e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Entregas">

  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">

  <!-- BIBLIOTECAS EXTERNAS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- VÍNCULO COM O SEU ARQUIVO CSS EXTERNO -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-container">
    <div class="menu-bar-left">
      <button class="btn-icon-menu" onclick="toggleModal('paradas-modal', true)"><i class="fa-solid fa-bars"></i></button>
      <button class="btn-icon-menu" onclick="centerOnUserGPS()" title="Centralizar na minha localização" style="color: #e11d48;"><i class="fa-solid fa-location-crosshairs"></i></button>
      <button class="btn-icon-menu" onclick="selectNearestStopToUser()" title="Ir para a parada mais próxima da minha localização" style="color: #3b30e2;"><i class="fa-solid fa-route"></i></button>
      <button id="btn-install" class="btn-install-badge" style="display:none;" onclick="triggerInstall()">
        <i class="fa-solid fa-download"></i> Instalar
      </button>
    </div>

    <div class="top-bar-right">
      <div class="stats-card">
        <div class="stat-item"><span class="stat-label">RESTANTE</span><span class="stat-value" id="time-val">0m</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-label">ENTREGAS</span><span class="stat-value"><span id="delivered-pkgs">0</span>/<span id="total-pkgs">0</span></span></div>
      </div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="tags-row" id="tags-row" style="display: none !important;">
        <div class="step-counter-indicator" id="tag-step">
          <span class="step-counter-dot"></span>
          <span id="step-counter-text"><span id="current-step-num">1</span>/<span id="total-step-num">1</span></span>
        </div>

        <div class="tags-right-group">
          <span class="tag-blue" id="tag-stop">PARADA&nbsp;<span id="current-stop-num">1</span></span>
          <button class="tag-packages-btn" onclick="openPackagesModal()">
            <i class="fa-solid fa-box" style="color: #ff5500;"></i>
            <span id="tag-packages">1 PACOTE(S)</span>
            <i class="fa-solid fa-chevron-right chevron-icon" style="font-size:9px; color: #ff5500;"></i>
          </button>
        </div>
      </div>
      <div class="address-title" id="address-title">AGUARDANDO PLANILHA</div>
      <div class="address-subtitle" id="address-subtitle">Abra o menu e carregue o arquivo</div>
      <div class="actions-row" id="actions-container"></div>
    </div>

    <div id="paradas-modal" class="modal">
      <div class="modal-header">
        <h3>Lista de Paradas</h3>
        <button class="btn-close-modal" onclick="toggleModal('paradas-modal', false)"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label for="excel-upload" class="upload-btn">
          <i class="fa-solid fa-file-excel"></i> CARREGAR PLANILHA
        </label>
        <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" style="display: none;" onclick="this.value=null;" onchange="handleFileUpload(event)">
        <div id="stops-list"></div>
      </div>
    </div>

    <div id="pacotes-modal" class="modal">
      <div class="modal-header">
        <h3>Pacotes da Parada</h3>
        <button class="btn-close-modal" onclick="toggleModal('pacotes-modal', false)"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="packages-list"></div>
      </div>
    </div>
  </div>

  <!-- LIBRARIAS EXTERNAS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- VÍNCULO COM O SEU ARQUIVO JAVASCRIPT EXTERNO -->
  <script src="script.js"></script>
</body>
</html>
