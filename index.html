<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mercado Compare</title>

  <!-- PWA e Meta Tags para Android e iOS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#5856d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mercado Compare">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:shopping-cart.svg?color=%235856d6">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

  <!-- Main Container -->
  <main class="flex-1 w-full space-y-3 pt-2 pb-6">

    <!-- Card Superior Flutuante -->
    <div class="px-2 sm:px-3">
      <div class="max-w-md mx-auto app-card p-4 rounded-3xl shadow-xl border space-y-3.5 relative overflow-hidden">
        
        <!-- Linha 1: Marca + Alternador de Tema + Botão Backup + Botão Instalar Dinâmico -->
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <div class="bg-[#5856d6]/10 text-[#5856d6] p-2 rounded-2xl shadow-inner">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
              </svg>
            </div>
            <div>
              <h1 class="text-base font-bold leading-tight tracking-tight">Mercado Compare</h1>
            </div>
          </div>

          <!-- Botões do Topo (Tema, Backup e Botão de Instalação PWA) -->
          <div class="flex items-center space-x-1.5">
            <!-- Botão de Instalação PWA (Oculto por padrão, aparece via JS quando o navegador permite) -->
            <button id="btn-install" style="display:none;" onclick="triggerInstall()" title="Instalar Aplicativo" class="px-2.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1 shadow-sm transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>Instalar</span>
            </button>

            <!-- Botão de Tema -->
            <button id="themeToggleBtn" title="Alternar Tema" class="p-2.5 border border-[var(--border-color)] bg-[var(--bg-input)] hover:opacity-80 rounded-xl transition-all shadow-sm flex items-center justify-center">
              <svg id="sunIcon" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              <svg id="moonIcon" class="w-4 h-4 text-[#5856d6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.03 9.03 0 0012 21a9.03 9.03 0 008.354-5.646z"></path></svg>
            </button>
            
            <!-- Botão Backup -->
            <button id="backupModalBtn" title="Backup e Restaurar" class="p-2.5 border border-[var(--border-color)] bg-[var(--bg-input)] hover:opacity-80 rounded-xl transition-all shadow-sm flex items-center justify-center text-[var(--text-main)]">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12C21 13.66 16.97 15 12 15C7.03 15 3 13.66 3 12"></path>
                <path d="M3 5V19C3 20.66 7.03 22 12 22C16.97 22 21 20.66 21 19V5"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Linha 2: Barra de Pesquisa -->
        <div class="relative w-full">
          <input type="text" id="searchInput" placeholder="Pesquisar..." class="w-full pl-9 pr-3 py-2 text-xs placeholder-zinc-500 rounded-2xl border focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-medium">
          <svg class="w-4 h-4 opacity-40 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Linha 3: Botões Principais -->
        <div class="flex items-center gap-2 pt-0.5">
          <button id="addItemBtn" class="flex-1 bg-[#5856d6] hover:bg-[#4f46e5] active:bg-[#4338ca] text-white py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 shadow-md transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
            <span>Novo Item</span>
          </button>

          <button id="manageStoresBtn" class="flex-1 bg-[var(--bg-input)] hover:opacity-80 py-2 px-3 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 border border-[var(--border-color)] shadow-sm transition-all active:scale-95">
            <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-4m0 4h4m-4-4l-4 4m4-4l4 4"></path></svg>
            <span>Mercados</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Store Summary Cards -->
    <div class="px-2 sm:px-3">
      <div class="max-w-md mx-auto app-card px-2 py-2.5 rounded-2xl border shadow-lg overflow-x-auto scrollbar-thin">
        <div id="storeSummaries" class="flex items-center divide-x divide-[var(--border-color)] w-full min-w-max"></div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="w-full app-card border-y border-[var(--border-color)] overflow-hidden shadow-lg">
      <div id="tableScrollContainer" class="overflow-auto scrollbar-thin max-h-[calc(100vh-320px)]">
        <table class="w-full text-left border-collapse text-xs relative">
          <thead>
            <tr id="tableHeaderRow" class="border-b border-[var(--border-color)] font-semibold"></tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-[var(--border-color)]"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modais (Backup, Item, Mercados) -->
  <div id="backupModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="app-card rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-[var(--border-color)] relative">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold">Backup e Restaurar</h3>
        <button id="closeBackupModal" class="opacity-60 hover:opacity-100 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <p class="text-[11px] opacity-70 leading-relaxed">Exporte seus dados em um arquivo JSON para salvar em seu computador/celular ou importar em outro dispositivo.</p>
      <div class="space-y-2 pt-1">
        <button id="exportJsonBtn" class="w-full py-2.5 px-3 bg-[var(--bg-input)] hover:opacity-80 border border-[var(--border-color)] rounded-2xl text-xs font-bold flex items-center justify-center space-x-2 shadow-sm transition-all">
          <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Exportar Dados (JSON)</span>
        </button>
        <button id="triggerImportBtn" class="w-full py-2.5 px-3 bg-[var(--bg-input)] hover:opacity-80 border border-[var(--border-color)] rounded-2xl text-xs font-bold flex items-center justify-center space-x-2 shadow-sm transition-all cursor-pointer">
          <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <span>Importar Arquivo JSON</span>
        </button>
        <input type="file" id="importJsonInput" class="hidden">
      </div>
      <div class="pt-2 border-t border-[var(--border-color)] text-center">
        <button id="resetDataBtn" class="text-rose-500 hover:opacity-80 text-[11px] font-bold transition-colors">Resetar para Dados Iniciais</button>
      </div>
    </div>
  </div>

  <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="app-card rounded-3xl max-w-md w-full p-4 space-y-3 shadow-2xl border border-[var(--border-color)] max-h-[90vh] overflow-y-auto scrollbar-thin">
      <h3 id="modalTitle" class="text-sm font-bold">Adicionar Item</h3>
      <form id="itemForm" class="space-y-3">
        <input type="hidden" id="itemId">
        <div class="grid grid-cols-4 gap-2">
          <div class="col-span-2">
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Nome do Item</label>
            <input type="text" id="itemName" required class="w-full px-3 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
          </div>
          <div>
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Qtd</label>
            <input type="number" id="itemQuantity" min="1" value="1" required class="w-full px-2.5 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-bold text-center">
          </div>
          <div>
            <label class="block text-[11px] font-semibold opacity-60 mb-1">Medida</label>
            <select id="itemUnit" class="w-full px-2 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6] font-medium">
              <option value="UN">UN</option><option value="Kg">Kg</option><option value="L">L</option><option value="g">g</option><option value="ml">ml</option><option value="Pct">Pct</option><option value="Cx">Cx</option>
            </select>
          </div>
        </div>
        <div id="priceInputs" class="space-y-2 pt-1">
          <label class="block text-[11px] font-semibold opacity-60">Preço Unitário e Observações por Mercado</label>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="closeItemModal" class="px-4 py-2 text-xs font-medium opacity-70 hover:opacity-100 rounded-xl transition-colors">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs bg-[#5856d6] hover:bg-[#4f46e5] text-white rounded-xl font-bold shadow-md transition-colors">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="storeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="app-card rounded-3xl max-w-sm w-full p-4 space-y-3.5 shadow-2xl border border-[var(--border-color)]">
      <h3 class="text-sm font-bold">Gerenciar Mercados</h3>
      <div id="storeList" class="space-y-1.5 max-h-48 overflow-y-auto"></div>
      <div class="flex gap-2 pt-1">
        <input type="text" id="newStoreName" placeholder="Novo Mercado..." class="flex-1 px-3 py-2 text-xs border border-[var(--border-color)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5856d6]">
        <button id="addStoreBtn" class="px-3.5 py-2 text-xs bg-[#5856d6] hover:bg-[#4f46e5] text-white rounded-xl font-bold transition-colors">Adicionar</button>
      </div>
      <div class="flex justify-end pt-2">
        <button id="closeStoreModal" class="px-4 py-2 text-xs font-medium opacity-70 hover:opacity-100 rounded-xl transition-colors">Fechar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
